<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藥學 OSCE 互動教學平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3EE;
    --card:#FFFFFF;
    --ink:#16302A;
    --ink-soft:#4A6058;
    --amber:#C98A2C;
    --amber-deep:#9C6A1E;
    --amber-pale:#F3E3C6;
    --success:#3F7D58;
    --success-pale:#DCEAE1;
    --line:#D8DCD2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
    color:var(--ink);
    font-family:"Noto Sans TC", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:40px 20px 80px;}

  header{margin-bottom:32px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;color:var(--amber-deep);text-transform:uppercase;}
  h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,5vw,36px);margin:6px 0 8px;}
  header p{color:var(--ink-soft);font-size:15px;line-height:1.8;max-width:560px;margin:0;}

  .section-label{
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;color:var(--ink-soft);
    text-transform:uppercase;margin:30px 0 12px;padding-left:2px;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px,1fr));gap:16px;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 20px;position:relative;display:flex;flex-direction:column;gap:10px;
    text-decoration:none;color:inherit;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card.active{cursor:pointer;}
  .card.active:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(22,48,42,.08);border-color:var(--amber);}
  .card.soon{opacity:.6;cursor:default;}

  .card .num{
    width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:13px;
  }
  .card.soon .num{background:var(--line);color:var(--ink-soft);}
  .card h3{font-family:"Noto Serif TC",serif;font-size:18px;margin:2px 0 0;}
  .card p{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:0;}
  .status{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
    padding:3px 9px;border-radius:6px;align-self:flex-start;margin-top:2px;
  }
  .status.ready{background:var(--success-pale);color:#245038;}
  .status.soon{background:var(--amber-pale);color:var(--amber-deep);}

  .admin-card{
    background:var(--ink);color:#fff;border-radius:var(--radius);padding:22px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:30px;
  }
  .admin-card div h3{font-family:"Noto Serif TC",serif;margin:0 0 4px;font-size:17px;color:#fff;}
  .admin-card div p{margin:0;font-size:13px;color:#CBDAD3;}
  .admin-card .status{background:rgba(255,255,255,.14);color:#EFE2C6;}

  footer.note{margin-top:36px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">Pharmacy OSCE</span>
    <h1>藥學 OSCE 互動教學平台</h1>
    <p>提供實習生與PGY用藥情境練習與正式評分，各站皆有練習模式（情境互動＋即時回饋）與評分模式（電子checklist＋成績自動記錄）。</p>
  </header>

  <div class="section-label">站別</div>
  <div class="grid">

    <a class="card active" href="station1.html">
      <div class="num">1</div>
      <h3>藥物諮詢站</h3>
      <p>處方交互作用辨識、用藥史詢問、跨團隊溝通建議。</p>
      <span class="status ready">可使用</span>
    </a>

    <div class="card soon">
      <div class="num">2</div>
      <h3>藥物衛教站</h3>
      <p>胰島素筆操作示範、Metformin衛教、teach-back確認理解。</p>
      <span class="status soon">籌備中</span>
    </div>

    <!--
      新增站別時，複製上面 <a class="card active" ...> 這個區塊即可：
      - href 改成新站別的檔名，例如 station3.html
      - .num 裡的數字改成站別序號
      - 標題與說明文字改成新站別內容
      - status 從 soon 改成 ready，class 從 card soon 改成 card active
    -->

  </div>

  <div class="admin-card">
    <div>
      <h3>老師後台</h3>
      <p>查看各站歷次成績、依學生/日期篩選、匯出紀錄</p>
    </div>
    <span class="status">籌備中</span>
  </div>

  <footer class="note">
    藥學 OSCE 互動教學平台 · 各站評分模式串接 Google Apps Script 自動記錄成績
  </footer>
</div>
</body>
</html>
